
<div class="page">
  <h2>Reset Password</h2>

  <section class="card">
    <form [formGroup]="form" (ngSubmit)="onReset()" novalidate>
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="example@domain.com" />
        <div class="error" *ngIf="f['email'].touched && f['email'].errors">
          <span *ngIf="f['email'].errors['required']">Email is required.</span>
          <span *ngIf="f['email'].errors['email']">Please enter a valid email address.</span>
        </div>
      </div>

      <div class="form-group">
        <label>New Password</label>
        <input type="password" formControlName="newPassword" placeholder="Min 8 chars incl. upper/lower/digit/special" />
        <div class="error" *ngIf="f['newPassword'].touched && f['newPassword'].errors">
          <span *ngIf="f['newPassword'].errors['required']">Password is required.</span>
          <span *ngIf="f['newPassword'].errors['weakPassword']">
            Password must be at least 8 characters and include uppercase, lowercase, number, and special character.
          </span>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" formControlName="confirmPassword" placeholder="Re-enter new password" />
        <div class="error" *ngIf="(form.touched || f['confirmPassword'].touched) && form.errors?.['passwordsMismatch']">
          <span>Passwords do not match.</span>
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary" [disabled]="form.invalid || submitting()">Update Password</button>
        <a routerLink="/login" class="link">Back to Login</a>
      </div>

      <div class="message" [class.success]="message()" *ngIf="message()">{{ message() }}</div>
    </form>
  </section>
</div>
